name: 🔄 自包含 Go Module 自动重命名 (权限优化)

on:
  push:

jobs:
  rename:
    runs-on: ubuntu-latest
    
    # 权限优化：只需写入 contents 权限
    permissions:
      contents: write   # 允许写入代码和提交
      # 不再需要 workflows: write 权限
    
    steps:
      - name: ⬇️ Checkout repository
        # 必须传入 token 才能在后面拥有推送的权限
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          
      - name: 🛠️ Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22' 

      - name: 📝 Rename Module Paths and Update Files
        id: rename
        run: |
          # --- 定义变量 ---
          OLD_MODULE="github.com/refraction-networking/utls"
          NEW_MODULE="github.com/mutls/mutls"
          
          echo "Starting module rename from $OLD_MODULE to $NEW_MODULE..."
          
          # 1. 替换 go.mod 文件中的 module 路径
          echo "1. Renaming module definition in go.mod..."
          sed -i "s|module $OLD_MODULE|module $NEW_MODULE|g" go.mod

          # 2. 替换所有 .go 文件中的导入路径
          echo "2. Renaming import paths in all Go files..."
          # 使用 -path './.git' -prune -o 避免查找隐藏目录
          find . -path './.git' -prune -o -type f -name "*.go" -exec sed -i "s|$OLD_MODULE|$NEW_MODULE|g" {} +

          # 3. 替换非Go文件中的引用
          echo "3. Renaming references in documentation and other files..."
          find . -path './.git' -prune -o -type f \( -name "*.md" -o -name "*.yml" -o -name "*.yaml" \) -exec sed -i "s|$OLD_MODULE|$NEW_MODULE|g" {} +

          # 4. 运行 go mod tidy 来处理 go.mod 中的依赖和更新 go.sum
          echo "4. Running go mod tidy to clean dependencies and update go.sum..."
          go mod tidy
          
          echo "Module renaming operations finished."

      - name: ⚙️ Check for changes and Configure Git
        id: git_status
        run: |
          # 检查是否有未提交的更改
          if [ -n "$(git status --porcelain)" ]; then
            echo "changes_detected=true" >> $GITHUB_OUTPUT
            echo "Changes detected: Files need to be committed."
            
            # 配置 Git 用户信息
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            
          else
            echo "changes_detected=false" >> $GITHUB_OUTPUT
            echo "No changes detected. Skipping commit."
          fi

      - name: 📝 Commit and Push changes (精确添加文件)
        if: steps.git_status.outputs.changes_detected == 'true'
        run: |
          COMMIT_MESSAGE="chore(module): Auto rename Go module to github.com/mutls/mutls"
          
          echo "Adding specific changed files to commit..."
          
          # 1. 显式添加 go.mod 和 go.sum
          git add go.mod go.sum

          # 2. 查找并添加所有被修改的 Go 文件
          # 注意：这里我们再次运行 find 命令，但这次是将其输出传递给 git add
          find . -path './.git' -prune -o -type f -name "*.go" -print0 | xargs -0 git add
          
          # 3. 查找并添加所有被修改的文档/配置问文件
          find . -path './.git' -prune -o -type f \( -name "*.md" -o -name "*.yml" -o -name "*.yaml" \) -print0 | xargs -0 git add
          
          # 4. 提交更改
          git commit -m "$COMMIT_MESSAGE"
          
          # 5. 推送更改
          echo "Pushing changes back to repository..."
          git push
          
          echo "Commit and push successful."

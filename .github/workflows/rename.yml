name: 🔄 自包含 Go Module 自动重命名

on:
  push:

jobs:
  rename:
    runs-on: ubuntu-latest
    
    # ⭐ 关键修改：添加权限配置 ⭐
    # contents: write 允许工作流程提交和推送代码更改。
    # workflows: write 允许工作流程修改或提交工作流程文件自身 (解决远程拒绝错误)。
    permissions:
      contents: write
      workflows: write 
      
    steps:
      - name: ⬇️ Checkout repository (with push token)
        # 必须传入 GITHUB_TOKEN，以便后续 Git 命令可以推送更改。
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          
      - name: 🛠️ Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22' 

      - name: 📝 Rename Module Paths and Update Files
        id: rename
        run: |
          # --- 定义变量 ---
          OLD_MODULE="github.com/refraction-networking/utls"
          NEW_MODULE="github.com/mutls/mutls"
          
          echo "Starting module rename from $OLD_MODULE to $NEW_MODULE..."
          
          # 1. 替换 go.mod 文件中的 module 路径
          echo "1. Renaming module definition in go.mod..."
          sed -i "s|module $OLD_MODULE|module $NEW_MODULE|g" go.mod

          # 2. 替换所有 .go 文件中的导入路径
          echo "2. Renaming import paths in all Go files..."
          # 查找所有 .go 文件并替换旧的导入路径
          find . -type f -name "*.go" -exec sed -i "s|$OLD_MODULE|$NEW_MODULE|g" {} +

          # 3. 替换非Go文件中的引用 (例如 README, 文档等)
          echo "3. Renaming references in documentation and other files..."
          # 查找 .md, .yml, .yaml 文件并替换引用
          find . -type f \( -name "*.md" -o -name "*.yml" -o -name "*.yaml" \) -exec sed -i "s|$OLD_MODULE|$NEW_MODULE|g" {} +

          # 4. 运行 go mod tidy 来处理 go.mod 中的依赖和更新 go.sum
          echo "4. Running go mod tidy to clean dependencies and update go.sum..."
          go mod tidy
          
          echo "Module renaming operations finished."

      - name: ⚙️ Check for changes and Configure Git
        id: git_status
        run: |
          # 检查是否有未提交的更改
          if [ -n "$(git status --porcelain)" ]; then
            echo "changes_detected=true" >> $GITHUB_OUTPUT
            echo "Changes detected: Files need to be committed."
            
            # 配置 Git 用户信息，这是提交的必要步骤
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            
          else
            echo "changes_detected=false" >> $GITHUB_OUTPUT
            echo "No changes detected. Skipping commit."
          fi

      - name: 📝 Commit and Push changes
        if: steps.git_status.outputs.changes_detected == 'true'
        run: |
          COMMIT_MESSAGE="chore(module): Auto rename Go module to github.com/mutls/mutls"
          
          # 1. 添加所有更改的文件
          git add .
          
          # 2. 提交更改
          git commit -m "$COMMIT_MESSAGE"
          
          # 3. 推送更改到当前分支
          echo "Pushing changes back to repository..."
          git push
          
          echo "Commit and push successful."
